# ArkCat pre-commit hooks
# Install hooks (commitlint runs on the commit-msg stage — both are required):
#   pre-commit install --hook-type pre-commit --hook-type commit-msg
# Full run: pre-commit run --all-files
# NOTE: the hook repos below are fetched from GitHub when pre-commit runs — with
# GitHub unreachable (no mirror/proxy configured), pre-commit cannot prepare the
# hook environment and commits are BLOCKED; make GitHub reachable first.
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
        # ohpm 管理的 lock 文件（根目录 + entry/，2026-09-22 起）不保证尾部换行，
        # 入库即按工具原生形态（无尾换行），豁免本钩子——否则每次构建必脏、提交被打断
        exclude: (^|/)oh-package-lock\.json5$
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: check-symlinks
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.3
    hooks:
      - id: markdownlint-cli2
        # --no-globs：只检查本次提交的文件，避免 config 里的 globs
        # 强制扫描未暂存/旧的 md 文件（pre-commit 会在干净检出上运行钩子）
        args: [--no-globs]
        additional_dependencies:
          - markdownlint-cli2@0.23.3
  - repo: https://github.com/alessandrojcm/commitlint-pre-commit-hook
    rev: v9.27.0
    hooks:
      - id: commitlint
        stages: [commit-msg]
        additional_dependencies:
          - "@commitlint/cli@21.2.3"
          - "@commitlint/config-conventional@21.2.3"
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: spec-lint
        name: Spec 合规检查
        entry: bash scripts/check-spec.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: signing-config
        name: 禁止 build-profile.json5 携带本机签名信息（绝对路径/非空 signingConfigs）
        entry: bash scripts/check-signing-config.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: hardcoded-colors
        name: 禁止 UI 硬编码颜色（走 color.json / PrimerTokens）
        entry: python3 scripts/check-hardcoded-colors.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: hardcoded-fontsize
        name: 禁止硬编码字号/字重（走 float.json；字重上限 600）
        entry: python3 scripts/check-hardcoded-fontsize.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: ut-run
        name: 单元测试（宿主 node:test，esbuild 打包 ArkTS 纯函数链）
        entry: bash scripts/ut/run-local-tests.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
