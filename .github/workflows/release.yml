name: Release

# 发版时自动构建无签名 release HAP 并附加到 GitHub Release 产物。
# 触发时机 = Release 发布（发版流程 develop → main FF → tag → gh release create 的最后一步）。
# 无签名口径：仓库内 build-profile.json5 的 signingConfigs 为空（签名材料仅存维护者本机，
# 见 scripts/ci-build.sh 注释），产物不含任何签名——取包者用自己 AGC 账号签发的
# 证书/Profile 自行签名后经 hdc 安装到开发者设备。
on:
  release:
    types: [published]

# 上传 Release 资产需要 contents: write（专用工作流，不影响 ci.yml 的只读权限）
permissions:
  contents: write

jobs:
  unsigned-hap:
    name: Attach unsigned release HAP
    runs-on: macos-latest
    steps:
      - name: Checkout
        # release 事件默认检出 tag 指向的提交，产物与发布内容一一对应
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup HarmonyOS CLI tools (API 26)
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true

      - name: Install dependencies
        run: ohpm install --all

      # buildMode=release + 无 signingConfigs → 产出 entry-default-unsigned.hap
      # （与 harmony-build 的 debug 构建同源，仅构建档位不同）
      - name: Build unsigned release HAP
        run: |
          export DEVECO_SDK_HOME=$HOS_SDK_HOME
          hvigorw assembleHap --mode module -p product=default -p buildMode=release --no-daemon

      - name: Attach HAP to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          # 资产名带 versionName（包自身的身份，App 内 About 页显示的同一版本号）
          VERSION=$(sed -n 's/.*"versionName"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' AppScope/app.json5)
          HAP=$(find entry/build/default/outputs -name 'entry-default-unsigned.hap' | head -n1)
          if [ -z "$HAP" ]; then
            echo "❌ unsigned HAP not found under entry/build/default/outputs"
            find entry/build/default/outputs -name '*.hap' || true
            exit 1
          fi
          ASSET="ArkCat-${VERSION}-unsigned.hap"
          cp "$HAP" "$ASSET"
          gh release upload "$TAG" "$ASSET" --clobber
          echo "✅ attached $ASSET to release $TAG"
