name: CI

on:
  push:
  pull_request:
    branches: [main, develop]

# 权限最小化（gitleaks-action 在 PR 事件下需读取 PR commits 列表）
permissions:
  contents: read
  pull-requests: read

# 并发控制：同一分支的新 push 取消旧 run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────
  # Job 1: Spec 合规检查
  # ──────────────────────────────────────────
  spec-lint:
    name: Spec Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check spec files
        run: bash scripts/check-spec.sh

  # ──────────────────────────────────────────
  # Job 2: Commit message 检查（与本地 pre-commit commitlint 同版本同规范）
  # ──────────────────────────────────────────
  commit-lint:
    name: Commit Message Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install commitlint（与 .pre-commit-config.yaml 同版本）
        run: npm install --no-save @commitlint/cli@21.2.3 @commitlint/config-conventional@21.2.3

      - name: Check commit messages
        run: |
          # 获取当前 push/PR 中的所有 commit
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
            HEAD="${{ github.event.pull_request.head.sha }}"
          else
            BASE="${{ github.event.before }}"
            HEAD="${{ github.sha }}"
          fi

          # 首次推送（before 全零）或 force push（before 不在链上）：
          # 无法确定真实范围，退化为只校验本次 HEAD 提交
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git merge-base --is-ancestor "$BASE" "$HEAD" 2>/dev/null; then
            git log -1 --format=%B "$HEAD" > /tmp/commit-msg.txt
            npx commitlint --edit /tmp/commit-msg.txt
          else
            npx commitlint --from "$BASE" --to "$HEAD"
          fi

  # ──────────────────────────────────────────
  # Job 3: 文件结构完整性检查
  # ──────────────────────────────────────────
  structure-check:
    name: Project Structure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify required files exist
        run: |
          REQUIRED_FILES=(
            "README.md"
            "AGENTS.md"
            "hvigorfile.ts"
            "build-profile.json5"
            "oh-package.json5"
            "code-linter.json5"
            "AppScope/app.json5"
            "entry/build-profile.json5"
            "entry/hvigorfile.ts"
            "entry/src/main/module.json5"
            "entry/src/main/ets/entryability/EntryAbility.ts"
            "entry/src/main/ets/pages/Index.ets"
            "specs/_TEMPLATE.md"
            ".gitignore"
          )

          ERRORS=0
          for f in "${REQUIRED_FILES[@]}"; do
              if [ ! -f "$f" ]; then
                  echo "❌ Missing: $f"
                  ERRORS=$((ERRORS + 1))
              fi
          done

          if [ $ERRORS -gt 0 ]; then
              echo ""
              echo "Missing $ERRORS required file(s)"
              exit 1
          fi
          echo "✅ All required files present"

      - name: Verify spec numbering (no gaps)
        run: |
          SPECS=$(find specs -maxdepth 1 -name "*.md" ! -name "_TEMPLATE.md" ! -name "README.md" | sort)
          EXPECTED=1
          for f in $SPECS; do
              NUM=$(basename "$f" | grep -oE "^[0-9]+" || true)
              if [ -z "$NUM" ]; then
                  echo "❌ Spec filename has no leading number: $(basename $f)"
                  exit 1
              fi
              if [ "$NUM" -ne "$EXPECTED" ]; then
                  echo "❌ Spec numbering gap: expected $(printf '%03d' $EXPECTED), got $(basename $f)"
                  exit 1
              fi
              EXPECTED=$((EXPECTED + 1))
          done
          echo "✅ Spec numbering continuous (1..$((EXPECTED - 1)))"

  # ──────────────────────────────────────────
  # Job 4: HarmonyOS 构建（macOS；签名材料在本机 ~/.ohos/config 不进 CI →
  # ci-build.sh 剥除 signingConfigs，产出可装模拟器的 unsigned HAP）
  # ⚠️ 禁用中：私有仓库 macOS runner 计费 ×10（2000 分钟/月免费额度≈30 次 push）；
  #    仓库 public 后恢复（删掉 job 顶部 if:false 即可）——恢复点见 handoff.md
  # ──────────────────────────────────────────
  harmony-build:
    name: HarmonyOS Build (debug HAP)
    runs-on: macos-latest
    if: false  # 私仓 runner 计费暂停；仓库转 public 后恢复
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup HarmonyOS CLI tools (API 26)
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true

      - name: Install dependencies
        run: ohpm install --all

      - name: Build debug HAP
        run: bash scripts/ci-build.sh

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v7
        with:
          name: arkcat-debug-hap
          path: entry/build/default/outputs/**/*.hap
          if-no-files-found: error

  # ──────────────────────────────────────────
  # Job 5: 样式门禁——禁止 UI 硬编码颜色/字号/字重（与 pre-commit 对齐）
  # ──────────────────────────────────────────
  hardcoded-colors:
    name: Hardcoded Colors & Font Sizes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check hardcoded colors
        run: python3 scripts/check-hardcoded-colors.py

      - name: Check hardcoded font sizes & weights
        run: python3 scripts/check-hardcoded-fontsize.py

  # ──────────────────────────────────────────
  # Job 6: Secret 泄漏检测（gitleaks；与本地 pre-commit gate 对齐）
  # ──────────────────────────────────────────
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # action@v3 默认下载 8.24.3（dist/index.js 为
          # `process.env.GITLEAKS_VERSION || "8.24.3"`），比本地落后 6 个 patch。
          # 与 .pre-commit-config.yaml 的 gitleaks rev 对齐——须同版本同升降
          GITLEAKS_VERSION: 8.30.1

  # ──────────────────────────────────────────
  # Job 7: 单元测试（宿主 node:test；esbuild 打包 ArkTS 纯函数链）
  # ──────────────────────────────────────────
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install esbuild (devDependency)
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: bash scripts/ut/run-local-tests.sh

  # ──────────────────────────────────────────
  # Job 8: 官方 Local Test（macOS 专属：hvigorw test 暂不支持 Linux）
  # Hypium + 真实 ArkTS 语义，产出可按文件统计的覆盖率报告
  # ⚠️ 禁用中：私仓计费 ×10；2026-09-12 已实测首跑全绿（setup 102s / test 16s），
  #    仓库 public 后恢复（删掉 if: false 即可）
  # ──────────────────────────────────────────
  official-local-test:
    name: Official Local Test (macOS)
    runs-on: macos-latest
    if: false  # 私仓 runner 计费暂停；仓库转 public 后恢复（首跑已验证通过）
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup HarmonyOS CLI tools (API 26)
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true

      - name: Install dependencies
        run: ohpm install --all

      - name: Run official local test
        run: |
          export DEVECO_SDK_HOME=$HOS_SDK_HOME
          hvigorw test -p module=entry -p coverage=true --no-daemon

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: local-test-coverage
          path: entry/.test/default/outputs/test/reports
          if-no-files-found: warn

  # ──────────────────────────────────────────
  # Job 9: 官方 Local Test（Windows）——面向开源后使用 Windows 的贡献者，
  # 与 Job 8 同一套 hvigorw test + Hypium 覆盖率流程
  # setup-ohos 的 Windows 支持要求 CLI tools > 6.1.1.280（本 job 用 26.0.0.821 ✅）；
  # Windows 版 CLI tools 经 PATH 提供 hvigorw.bat / ohpm.bat（PowerShell 按 PATHEXT 解析）
  # ⚠️ 禁用中：私仓 Windows runner 计费 ×2；2026-09-12 已实测首跑全绿
  #    （无缓存 setup 8m38s / test 1m38s / SDK 缓存保存约 15m，二次起走缓存提速），
  #    仓库 public 后随 Job 8 一同恢复
  # ──────────────────────────────────────────
  official-local-test-windows:
    name: Official Local Test (Windows)
    runs-on: windows-latest
    if: false  # 私仓 runner 计费暂停；仓库转 public 后恢复（首跑已验证通过）
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Setup HarmonyOS CLI tools (API 26)
        uses: ErBWs/setup-ohos@v2
        with:
          version: 26.0.0.821
          cache: true

      - name: Install dependencies
        run: ohpm install --all

      - name: Run official local test
        shell: pwsh
        run: |
          $env:DEVECO_SDK_HOME = $env:HOS_SDK_HOME
          hvigorw.bat test -p module=entry -p coverage=true --no-daemon

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: local-test-coverage-windows
          path: entry/.test/default/outputs/test/reports
          if-no-files-found: warn
