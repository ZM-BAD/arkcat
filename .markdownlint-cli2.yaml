# markdownlint-cli2 config
config:
  MD013: false   # line length: no limit for Chinese text/tables
  MD024: false   # duplicate headings: bilingual docs mirror sections
  MD033: false   # inline HTML: allow badges
  MD036: false   # emphasis-as-heading: common in Chinese docs (e.g. "借人")
  MD022: false   # headings directly followed by lists: compact repo style
  MD032: false   # lists directly after headings: compact repo style
  MD041: false   # first line H1: allow intro quote before heading
# MD060 保持启用：表格分隔行（| --- |）与内容行（| a | b |）须两侧各留一个空格
# （GFM 标准风格，避免多工具默认规则下「表格式不正确」误报）
# 只扫描仓库自己的文档，避免把项目本地的 AI Skills 库（skills/、.claude/ 等）
# 全树扫描进 pre-commit（数百 MB、数万个文件）
globs:
  - "*.md"
  - "specs/**/*.md"
  - "docs/**/*.md"
ignores:
  - node_modules/
  - .git/
  - oh_modules/
  - build/
  - .hvigor/
  - skills/
  - .claude/
  - .codegenie/
  - .deveco/
  - .qoder/
